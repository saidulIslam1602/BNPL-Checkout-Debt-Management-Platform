version: '3.8'

services:
  # Payment API Service
  payment-api:
    build:
      context: ./src/Services/Payment.API
      dockerfile: Dockerfile
    container_name: yourcompany-payment-api
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80;https://+:443
      - ASPNETCORE_Kestrel__Certificates__Default__Password=your-certificate-password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=YourCompanyBNPL_Payment;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true
      - Jwt__Key=yourcompany-bnpl-super-secret-key-for-production-change-this
      - Jwt__Issuer=https://api.yourcompany.com
      - Jwt__Audience=https://api.yourcompany.com
      - Redis__ConnectionString=redis:6379
      - MongoDB__ConnectionString=mongodb://mongodb:27017
      - MongoDB__DatabaseName=YourCompanyBNPL
    volumes:
      - ./certificates:/https:ro
      - ./logs/payment-api:/app/logs
    depends_on:
      - sqlserver
      - redis
      - mongodb
    networks:
      - bnpl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Risk Assessment API Service
  risk-assessment-api:
    build:
      context: ./src/Services/RiskAssessment.API
      dockerfile: Dockerfile
    container_name: yourcompany-risk-assessment-api
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=YourCompanyBNPL_RiskAssessment;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true
      - Redis__ConnectionString=redis:6379
      - MongoDB__ConnectionString=mongodb://mongodb:27017
      - MongoDB__DatabaseName=YourCompanyBNPL
    volumes:
      - ./logs/risk-assessment-api:/app/logs
    depends_on:
      - sqlserver
      - redis
      - mongodb
    networks:
      - bnpl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Notification API Service
  notification-api:
    build:
      context: ./src/Services/Notification.API
      dockerfile: Dockerfile
    container_name: yourcompany-notification-api
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=YourCompanyBNPL_Notification;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true
      - Redis__ConnectionString=redis:6379
      - MongoDB__ConnectionString=mongodb://mongodb:27017
      - MongoDB__DatabaseName=YourCompanyBNPL
      - Email__SmtpServer=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__Username=your-email@gmail.com
      - Email__Password=your-app-password
      - Twilio__AccountSid=your-twilio-account-sid
      - Twilio__AuthToken=your-twilio-auth-token
      - Twilio__PhoneNumber=your-twilio-phone-number
    volumes:
      - ./logs/notification-api:/app/logs
    depends_on:
      - sqlserver
      - redis
      - mongodb
    networks:
      - bnpl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Settlement API Service
  settlement-api:
    build:
      context: ./src/Services/Settlement.API
      dockerfile: Dockerfile
    container_name: yourcompany-settlement-api
    ports:
      - "5004:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=YourCompanyBNPL_Settlement;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true
      - Redis__ConnectionString=redis:6379
      - MongoDB__ConnectionString=mongodb://mongodb:27017
      - MongoDB__DatabaseName=YourCompanyBNPL
    volumes:
      - ./logs/settlement-api:/app/logs
    depends_on:
      - sqlserver
      - redis
      - mongodb
    networks:
      - bnpl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Real-time Node.js API Service
  realtime-api:
    build:
      context: ./src/Services/RealTime.Node.API
      dockerfile: Dockerfile
    container_name: yourcompany-realtime-api
    ports:
      - "5005:5005"
    environment:
      - NODE_ENV=production
      - PORT=5005
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGODB_URI=mongodb://mongodb:27017/YourCompanyBNPL
      - JWT_SECRET=yourcompany-bnpl-super-secret-key-for-production-change-this
      - ALLOWED_ORIGINS=http://localhost:4200,http://localhost:4201,http://localhost:4202,https://admin.yourcompany.com,https://consumer.yourcompany.com
    volumes:
      - ./logs/realtime-api:/app/logs
    depends_on:
      - redis
      - mongodb
    networks:
      - bnpl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5005/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: yourcompany-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./scripts/sql:/docker-entrypoint-initdb.d
    networks:
      - bnpl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: yourcompany-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass your-redis-password
    volumes:
      - redis_data:/data
    networks:
      - bnpl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: yourcompany-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=your-mongodb-password
      - MONGO_INITDB_DATABASE=YourCompanyBNPL
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo:/docker-entrypoint-initdb.d
    networks:
      - bnpl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: yourcompany-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certificates:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - payment-api
      - risk-assessment-api
      - notification-api
      - settlement-api
      - realtime-api
    networks:
      - bnpl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Elasticsearch for Logging
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: yourcompany-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - bnpl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Kibana for Log Analysis
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: yourcompany-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - bnpl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus for Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: yourcompany-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - bnpl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Grafana for Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: yourcompany-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - bnpl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Networks
networks:
  bnpl-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  sqlserver_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local